# One-off, run by hand: applies v2/supabase/migrations to the Supabase project
# and seeds it from trip-data.json. Needs these repository secrets
# (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN     personal access token (Account → Access Tokens)
#   SUPABASE_PROJECT_REF      the project ref (the part before .supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY Project → Settings → API Keys → service_role
#   GOOGLE_PLACES_API_KEY     optional; resolves Google place ids during the seed
# Every step is idempotent, so the workflow can be re-run.
name: Supabase setup (v2)

on:
  # Runs when this file is pushed to the setup branch (GitHub only lists
  # workflow_dispatch workflows that already exist on the default branch).
  push:
    branches: [ccr-57489b00-8hd97m]
    paths: [.github/workflows/supabase-setup.yml]
  workflow_dispatch:
    inputs:
      travellers_map:
        description: "Optional fixes to the traveller mapping, e.g. --map=someone@x.com=sister"
        required: false
        default: ""

jobs:
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Apply the migration (trip schema, RLS, functions)
        run: npm run db:push
      - name: Build data/travellers.json from the earlier app's travellers
        run: npx tsx scripts/travellers-from-v1.ts ${{ inputs.travellers_map }}
      - name: Seed (travellers, auth users, trip-data.json, place ids)
        run: npm run seed
      - name: Row counts
        run: |
          node -e '
            const { createClient } = require("@supabase/supabase-js");
            const sb = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY, { db: { schema: "trip" } });
            (async () => {
              for (const t of ["travellers", "regions", "places", "closures", "versions", "stays", "deadlines"]) {
                const { count, error } = await sb.from(t).select("*", { count: "exact", head: true });
                console.log(t.padEnd(12), error ? error.message : count);
              }
            })();
          '
